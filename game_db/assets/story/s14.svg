    <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8b8a0" stop-opacity=".95"/>
    <stop offset="1" stop-color="#8a5f7a" stop-opacity=".9"/>
