    <stop offset=".7" stop-color="#4a4a82"/>
    <stop offset=".9" stop-color="#8a5f7a"/>
    <stop offset="1" stop-color="#c9836a"/>
  </linearGradient>
  <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5a5a8f"/>
    <stop offset=".55" stop-color="#3d3a6b"/>
    <stop offset="1" stop-color="#2a2450"/>
  </linearGradient>
  <linearGradient id="peak2" x1="0" y1="0" x2="0" y2="1">
