    <stop offset=".4" stop-color="#0f5c8a"/>
    <stop offset=".75" stop-color="#0a3a68"/>
    <stop offset="1" stop-color="#062a52"/>
  </linearGradient>
  <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bfeaff" stop-opacity=".5"/>
    <stop offset="1" stop-color="#bfeaff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="crystal" x1="0" y1="0" x2="0" y2="1">
